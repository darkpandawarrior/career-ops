name: Build Desktop App

# Manual-only: macOS/Windows runners burn 10-25x Actions minutes on a private
# repo, packaging is only needed for releases, and the upload step has been
# failing anyway (dist/*.dmg|exe not found) — diagnose via a dispatch run.
on:
  workflow_dispatch:

jobs:
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            desktop/package-lock.json

      - name: Install root dependencies
        run: npm install

      - name: Install web dependencies
        working-directory: web
        run: npm install

      - name: Build web app
        working-directory: web
        run: npm run build

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install

      - name: Package desktop app
        working-directory: desktop
        run: npm run package

      - name: Upload Windows artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: career-ops-desktop-windows
          path: desktop/dist/*.exe

      - name: Upload macOS artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: career-ops-desktop-macos
          path: desktop/dist/*.dmg
