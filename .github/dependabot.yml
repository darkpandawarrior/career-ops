version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      openai-anthropic:
        patterns: ["openai", "@anthropic-ai/*"]
      playwright:
        patterns: ["playwright", "@playwright/*"]

  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      next-react:
        patterns: ["next", "react", "react-dom", "@types/react*"]

  - package-ecosystem: "npm"
    directory: "/templates/portfolio-site"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
