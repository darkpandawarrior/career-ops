  # ── CutShort — India product/startup job board ──────────────────────
  # Reads the embedded __NEXT_DATA__ JSON off CutShort's public SEO listing
  # pages (https://cutshort.io/jobs/<slug>). Not auto-detected — cutshort.io
  # is a shared multi-tenant domain with no per-company signal, so set
  # `provider: cutshort` explicitly. Each slug is a fixed ~50-job snapshot
  # with no real pagination (?page=N is ignored); add one entry per
  # role/city slug you want covered. Browse https://cutshort.io/jobs for
  # the full slug catalog. The interactive cutshort.io/jobs?q=... search
  # app is session-gated and out of scope — this only reads the public
  # SEO pages, which robots.txt permits.

  - name: CutShort — Android (Pune)
    careers_url: https://cutshort.io/jobs/android-developer-jobs-in-pune
    provider: cutshort
    enabled: false
    notes: "India product/startup board. One fixed ~50-job snapshot per slug."

  - name: CutShort — Android (Bangalore)
    careers_url: https://cutshort.io/jobs/android-developer-jobs-in-bangalore-bengaluru
    provider: cutshort
    enabled: false
    notes: "India product/startup board. One fixed ~50-job snapshot per slug."

