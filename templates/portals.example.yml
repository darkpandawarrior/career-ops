  # ── Getro — VC portfolio "talent network" boards ───────────────────
  # One board aggregates jobs across a fund's portfolio companies (each job
  # belongs to the portfolio company, not the fund). Set `getro_collection` to
  # the board's numeric network id (the `network.id` in the board page's
  # __NEXT_DATA__). `careers_url` is reference-only. Optional knobs:
  # `getro_max_pages` (default 40), `getro_max_age_days` (default 90, a
  # pagination bound — newest-first, stops once postings cross the age).

  - name: b2venture (portfolio)
    careers_url: https://jobs.b2venture.vc
    provider: getro
    getro_collection: 4283
    enabled: false
    notes: "Swiss VC portfolio board (Getro)"

  - name: Cherry Ventures (portfolio)
    careers_url: https://jobs.cherry.vc
    provider: getro
    getro_collection: 44081
    enabled: false
    notes: "VC portfolio board (Getro)"

